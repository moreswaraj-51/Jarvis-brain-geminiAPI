<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Unified OS</title>
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; }
        .container { display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: auto; }
        .panel { border: 1px solid #00ffcc; padding: 15px; border-radius: 5px; background: #111; }
        video { width: 100%; border: 1px solid #005544; border-radius: 4px; }
        button { background: #00ffcc; color: black; padding: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; }
        button:active { background: #00aa88; }
        .mic-btn { background: #ff3366; color: white; font-size: 18px; padding: 15px; border-radius: 50px; }
        .chat-log { height: 200px; overflow-y: auto; border: 1px solid #005544; padding: 10px; margin-bottom: 10px; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; margin: 5px 0;">JARVIS CORE ONLINE</h2>
        
        <!-- The AI Brain Panel -->
        <div class="panel">
            <h3>Neural Interface</h3>
            <div class="chat-log" id="chatbox">
                <p>> System initialized. Welcome, Swaraj.</p>
            </div>
            <!-- The Magic Microphone Button -->
            <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎙️ TAP TO SPEAK</button>
        </div>

        <!-- Optic & Tactical Controls -->
        <div class="panel">
            <h3>Optic Feed & Hardware</h3>
            <video id="camera" autoplay playsinline></video>
            <p>ESP32 Link: <span id="status" style="color: red;">Offline</span></p>
            <button onclick="sendHardwareCmd('IR_READ')">📡 SCAN NEW REMOTE SIGNAL</button>
            <button onclick="sendHardwareCmd('SERVO_CENTER')">Center Neck</button>
        </div>
    </div>

    <script>
        // --- 1. OPTIC SYSTEM (CAMERA) ---
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { document.getElementById('camera').srcObject = stream; })
            .catch(err => console.error("Camera error:", err));

        // --- 2. TACTICAL SYSTEM (ESP32 WEBSOCKET) ---
        const ws = new WebSocket('ws://192.168.1.100:81/'); // YOUR ESP32 IP HERE
        ws.onopen = () => {
            document.getElementById('status').style.color = "lime";
            document.getElementById('status').innerText = "ONLINE";
        };
        function sendHardwareCmd(cmd) { if(ws.readyState === WebSocket.OPEN) ws.send(cmd); }

        // --- 3. THE AI BRAIN (SPEECH TO TEXT & API CONNECTION) ---
        const chatbox = document.getElementById('chatbox');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        let isRecording = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            chatbox.innerHTML += `<p style="color:white">> Swaraj: ${transcript}</p>`;
            chatbox.scrollTop = chatbox.scrollHeight;
            sendToPythonBrain(transcript); // Send to your API!
        };

        function toggleMic() {
            if (!isRecording) {
                recognition.start();
                document.getElementById('micBtn').innerText = "🔴 LISTENING...";
                isRecording = true;
            } else {
                recognition.stop();
                document.getElementById('micBtn').innerText = "🎙️ TAP TO SPEAK";
                isRecording = false;
            }
        }

        // --- 4. CONNECTING TO YOUR PYTHON API ---
        async function sendToPythonBrain(message) {
            try {
                // Point this to your Python script's local IP address and port
                const response = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: message })
                });
                const data = await response.json();
                
                // Show Jarvis's reply in the chat
                chatbox.innerHTML += `<p style="color:#00ffcc">> Jarvis: ${data.reply}</p>`;
                chatbox.scrollTop = chatbox.scrollHeight;

                // Make Jarvis speak out loud!
                speakOutLoud(data.reply);
            } catch (error) {
                chatbox.innerHTML += `<p style="color:red">> Error connecting to Python Brain</p>`;
            }
        }

        // --- 5. JARVIS VOICE (TEXT TO SPEECH) ---
        function speakOutLoud(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 0.8; // Deep, robotic tone
            utterance.rate = 1.1;  // Slightly fast
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
