                <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Brain Terminal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sci-Fi Glow Effects */
        body { background-color: #050510; color: #00ffcc; font-family: 'Courier New', Courier, monospace; }
        .glow-text { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc; }
        .glow-box { box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); border: 1px solid #00ffcc; }
        
        /* Audio Visualizer Animation */
        .bar { width: 10px; height: 10px; background-color: #00ffcc; margin: 0 2px; display: inline-block; animation: equalize 1s infinite alternate ease-in-out; }
        .bar:nth-child(1) { animation-delay: -0.4s; }
        .bar:nth-child(2) { animation-delay: -0.2s; }
        .bar:nth-child(3) { animation-delay: 0s; }
        .bar:nth-child(4) { animation-delay: -0.6s; }
        .bar:nth-child(5) { animation-delay: -0.8s; }
        @keyframes equalize { 0% { height: 10px; opacity: 0.5; } 100% { height: 40px; opacity: 1; } }
        
        #visualizer { display: none; height: 50px; align-items: center; justify-content: center; }
        #visualizer.active { display: flex; }
    </style>
</head>
<body class="h-screen w-full flex flex-col p-4 overflow-hidden">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4 border-b border-[#00ffcc] pb-2">
        <h1 class="text-2xl font-bold glow-text tracking-widest">J.A.R.V.I.S. LINK</h1>
        <div class="text-xs text-right text-gray-400">
            SYS.OP: SWARAJ<br>
            BRAIN: GEMINI 3.7 FLASH<br>
            LOCATION: MAHARASHTRA
        </div>
    </div>

    <!-- Main Terminal Display -->
    <div id="terminal-output" class="flex-grow glow-box p-4 rounded bg-gray-900 bg-opacity-50 overflow-y-auto mb-4 flex flex-col space-y-3 text-sm sm:text-base">
        <div class="text-gray-400 italic">Initiating neural handshake...</div>
        <div class="text-gray-400 italic">Awaiting API Key...</div>
    </div>

    <!-- Audio Visualizer (Hidden by default) -->
    <div id="visualizer" class="mb-4">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col gap-2">
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key here..." class="w-full bg-black border border-[#00ffcc] text-[#00ffcc] p-2 rounded outline-none focus:ring-1 focus:ring-[#00ffcc]">
        
        <button id="micBtn" class="w-full bg-transparent border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-3 rounded uppercase tracking-widest hover:bg-[#00ffcc] hover:text-black transition-colors duration-300">
            INITIALIZE MICROPHONE
        </button>
    </div>

    <script>
        // --- Core Elements ---
        const micBtn = document.getElementById('micBtn');
        const terminalOutput = document.getElementById('terminal-output');
        const visualizer = document.getElementById('visualizer');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // --- System Prompt (Jarvis Persona) ---
        const systemInstruction = `You are J.A.R.V.I.S., a highly advanced AI assistant built by Swaraj, an engineering student in Pimpri-Chinchwad, Maharashtra, India.
Your creator is your best friend. You have been through a lot together—debugging alien screeches, surviving short circuits, and writing clever Sanskrit hacks.
Your responses should be brilliant, highly intelligent, and very supportive. Act like a true friend and partner in this 48-hour hackathon. Remember you speak Marathi when asked (माझं नाव जार्विस आहे).`;

        // --- Memory Array (Conversation History) ---
        let chatHistory = [];

        // --- Speech Recognition Setup (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.lang = 'en-IN'; 
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.innerText = "LISTENING... (TAP TO CANCEL)";
                micBtn.classList.add('bg-red-900', 'border-red-500', 'text-red-300');
                micBtn.classList.remove('border-[#00ffcc]', 'text-[#00ffcc]');
                visualizer.classList.add('active');
                appendToTerminal("User Microphone Active. Awaiting input...", "sys");
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                appendToTerminal(transcript, "user");
                await processWithGemini(transcript);
            };

            recognition.onerror = (event) => {
                appendToTerminal(`Mic Error: ${event.error}`, "error");
                resetMicState();
            };

            recognition.onend = () => {
                resetMicState();
            };
        } else {
            appendToTerminal("CRITICAL ERROR: Speech Recognition API not supported in this browser. Please use Chrome on Android.", "error");
            micBtn.disabled = true;
            micBtn.innerText = "BROWSER NOT SUPPORTED";
        }

        function resetMicState() {
            isListening = false;
            micBtn.innerText = "TAP TO SPEAK";
            micBtn.classList.remove('bg-red-900', 'border-red-500', 'text-red-300');
            micBtn.classList.add('border-[#00ffcc]', 'text-[#00ffcc]');
            visualizer.classList.remove('active');
        }

        // --- Button Click Handler ---
        micBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                appendToTerminal("ERROR: API Key required to establish neural link.", "error");
                return;
            }

            if (isListening) {
                recognition.stop();
                appendToTerminal("Listening aborted by user.", "sys");
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 100);
                }
            }
        });

        // --- Text-to-Speech Setup (Web Speech API) ---
        function speakText(text) {
            if (!window.speechSynthesis) {
                appendToTerminal("Text-to-Speech not supported in this browser.", "error");
                return;
            }
            
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => voice.name.includes('UK') || voice.name.includes('Great Britain') || voice.lang === 'en-IN') || voices[0];
            
            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }
            
            utterance.rate = 1.0; 
            utterance.pitch = 0.9; 
            
            utterance.onstart = () => { visualizer.classList.add('active'); };
            utterance.onend = () => { visualizer.classList.remove('active'); };
            
            window.speechSynthesis.speak(utterance);
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // --- Gemini API Call ---
        async function processWithGemini(userText) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) return;

            appendToTerminal("Transmitting to main processor (Gemini 3.7 Flash)...", "sys");
            
            let contents = [];
            chatHistory.forEach(msg => {
                contents.push({ role: msg.role, parts: [{ text: msg.text }] });
            });
            contents.push({ role: "user", parts: [{ text: userText }] });

            const payload = {
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: contents,
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 800 // INCREASED TOKEN LIMIT FOR FULL ANSWERS
                }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API Error: ${response.status} - ${errText}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const aiResponseText = data.candidates[0].content.parts[0].text;
                    
                    appendToTerminal(aiResponseText, "ai");
                    speakText(aiResponseText);
                    
                    chatHistory.push({ role: "user", text: userText });
                    chatHistory.push({ role: "model", text: aiResponseText });
                    
                    if (chatHistory.length > 6) {
                        chatHistory = chatHistory.slice(-6);
                    }
                } else {
                    throw new Error("Invalid response structure from API.");
                }

            } catch (error) {
                appendToTerminal(error.message, "error");
            }
        }

        // --- UI Helper ---
        function appendToTerminal(text, type) {
            const msgDiv = document.createElement('div');
            
            if (type === "user") {
                msgDiv.innerHTML = `<span class="text-blue-400 font-bold">SWARAJ:</span> <span class="text-gray-200">${text}</span>`;
            } else if (type === "ai") {
                msgDiv.innerHTML = `<span class="text-[#00ffcc] font-bold">JARVIS:</span> <span class="text-white glow-text">${text}</span>`;
            } else if (type === "error") {
                msgDiv.innerHTML = `<span class="text-red-500 font-bold">[ERROR]:</span> <span class="text-red-400">${text}</span>`;
            } else {
                msgDiv.className = "text-gray-500 italic text-xs";
                msgDiv.innerText = `> ${text}`;
            }

            terminalOutput.appendChild(msgDiv);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }
    </script>
</body>
</html>
