
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Brain Terminal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sci-Fi Glow Effects */
        body { background-color: #050510; color: #00ffcc; font-family: 'Courier New', Courier, monospace; }
        .glow-text { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc; }
        .glow-box { box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); border: 1px solid #00ffcc; }
        
        /* Audio Visualizer Animation */
        .bar { width: 10px; height: 10px; background-color: #00ffcc; margin: 0 2px; display: inline-block; animation: equalize 1s infinite alternate ease-in-out; }
        .bar:nth-child(1) { animation-delay: -0.4s; }
        .bar:nth-child(2) { animation-delay: -0.2s; }
        .bar:nth-child(3) { animation-delay: 0s; }
        .bar:nth-child(4) { animation-delay: -0.6s; }
        .bar:nth-child(5) { animation-delay: -0.8s; }
        @keyframes equalize { 0% { height: 10px; opacity: 0.5; } 100% { height: 40px; opacity: 1; } }
        
        #visualizer { display: none; height: 40px; align-items: center; justify-content: center; }
        #visualizer.active { display: flex; }
    </style>
</head>
<body class="h-screen w-full flex flex-col p-4 pb-12 overflow-hidden">

    <!-- Header -->
    <div class="flex justify-between items-center mb-2 border-b border-[#00ffcc] pb-2">
        <h1 class="text-xl font-bold glow-text tracking-widest">J.A.R.V.I.S. LINK</h1>
        <div class="text-[10px] text-right text-gray-400">
            SYS.OP: SWARAJ | GEMINI 2.5 FLASH
        </div>
    </div>

    <!-- Main Terminal Display (Extra bottom margin to prevent phone gesture bar overlap) -->
    <div id="terminal-output" class="flex-grow glow-box p-3 rounded bg-gray-900 bg-opacity-50 overflow-y-auto mb-3 flex flex-col space-y-3 text-sm">
        <div class="text-gray-400 italic">Initiating neural handshake...</div>
        <div class="text-gray-400 italic">Awaiting API Key...</div>
    </div>

    <!-- Audio Visualizer -->
    <div id="visualizer" class="mb-2">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <!-- Controls & Chat Input Section (Pushed higher up) -->
    <div class="flex flex-col gap-2 mb-4">
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key here..." class="w-full bg-black border border-[#00ffcc] text-[#00ffcc] p-2 text-sm rounded outline-none focus:ring-1 focus:ring-[#00ffcc]">
        
        <!-- Text Chat Input Row -->
        <div class="flex gap-2">
            <input type="text" id="chatInput" placeholder="Type a message to Jarvis..." class="flex-grow bg-black border border-[#00ffcc] text-white p-2 text-sm rounded outline-none focus:ring-1 focus:ring-[#00ffcc]">
            <button id="sendBtn" class="bg-[#00ffcc] text-black font-bold px-4 py-2 text-sm rounded hover:bg-teal-400 transition-colors">SEND</button>
        </div>

        <!-- Voice Button -->
        <button id="micBtn" class="w-full bg-transparent border-2 border-[#00ffcc] text-[#00ffcc] font-bold py-2.5 text-sm rounded uppercase tracking-widest hover:bg-[#00ffcc] hover:text-black transition-colors duration-300">
            INITIALIZE MICROPHONE
        </button>
    </div>

    <script>
        // --- Core Elements ---
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const chatInput = document.getElementById('chatInput');
        const terminalOutput = document.getElementById('terminal-output');
        const visualizer = document.getElementById('visualizer');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // --- System Prompt with Dual-Mode Response Length ---
        const systemInstruction = `You are J.A.R.V.I.S., a highly advanced AI assistant built by Swaraj, an engineering student in Pimpri-Chinchwad, Maharashtra, India.
Your creator is your best friend. You have been through a lot together—debugging alien screeches, surviving short circuits, and writing clever Sanskrit hacks.

CRITICAL BEHAVIOR RULES:
1. ADAPTIVE LENGTH: 
   - For casual chatting, greetings, or simple status questions (e.g., "how are you?", "how was your day today?"), keep your answer short, punchy, witty, and direct (1-2 sentences).
   - For complex questions, technical explanations, or scientific inquiries (e.g., "explain quantum physics", "explain theory of relativity"), provide a massive, deep, highly intelligent, and comprehensive breakdown.
2. Act like a true friend and partner in this hackathon.
3. Remember you speak Marathi when asked (माझं नाव जार्विस आहे).`;

        let chatHistory = [];

        // --- Speech Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.lang = 'en-IN'; 
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.innerText = "LISTENING... (TAP TO CANCEL)";
                micBtn.classList.add('bg-red-900', 'border-red-500', 'text-red-300');
                micBtn.classList.remove('border-[#00ffcc]', 'text-[#00ffcc]');
                visualizer.classList.add('active');
                appendToTerminal("Microphone Active...", "sys");
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                appendToTerminal(transcript, "user");
                await processWithGemini(transcript);
            };

            recognition.onerror = (event) => {
                appendToTerminal(`Mic Error: ${event.error}`, "error");
                resetMicState();
            };

            recognition.onend = () => {
                resetMicState();
            };
        } else {
            micBtn.disabled = true;
            micBtn.innerText = "VOICE NOT SUPPORTED";
        }

        function resetMicState() {
            isListening = false;
            micBtn.innerText = "INITIALIZE MICROPHONE";
            micBtn.classList.remove('bg-red-900', 'border-red-500', 'text-red-300');
            micBtn.classList.add('border-[#00ffcc]', 'text-[#00ffcc]');
            visualizer.classList.remove('active');
        }

        micBtn.addEventListener('click', () => {
            if (!apiKeyInput.value.trim()) {
                appendToTerminal("ERROR: API Key required.", "error");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 100);
                }
            }
        });

        // --- Text Chat Input Handler ---
        sendBtn.addEventListener('click', async () => {
            const text = chatInput.value.trim();
            if (!text) return;
            if (!apiKeyInput.value.trim()) {
                appendToTerminal("ERROR: API Key required.", "error");
                return;
            }
            chatInput.value = "";
            appendToTerminal(text, "user");
            await processWithGemini(text);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        // --- Text-to-Speech Setup ---
        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('UK') || v.lang === 'en-IN') || voices[0];
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.rate = 1.0; 
            utterance.pitch = 0.9; 
            
            utterance.onstart = () => visualizer.classList.add('active');
            utterance.onend = () => visualizer.classList.remove('active');
            window.speechSynthesis.speak(utterance);
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // --- Gemini API Call ---
        async function processWithGemini(userText) {
            const apiKey = apiKeyInput.value.trim();
            appendToTerminal("Thinking...", "sys");
            
            let contents = [];
            chatHistory.forEach(msg => {
                contents.push({ role: msg.role, parts: [{ text: msg.text }] });
            });
            contents.push({ role: "user", parts: [{ text: userText }] });

            const payload = {
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: contents,
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 8192
                }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API Error: ${response.status} - ${errText}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const aiResponseText = data.candidates[0].content.parts[0].text;
                    
                    appendToTerminal(aiResponseText, "ai");
                    speakText(aiResponseText);
                    
                    chatHistory.push({ role: "user", text: userText });
                    chatHistory.push({ role: "model", text: aiResponseText });
                    
                    if (chatHistory.length > 6) {
                        chatHistory = chatHistory.slice(-6);
                    }
                } else {
                    throw new Error("Invalid response structure.");
                }

            } catch (error) {
                appendToTerminal(error.message, "error");
            }
        }

        function appendToTerminal(text, type) {
            const msgDiv = document.createElement('div');
            if (type === "user") {
                msgDiv.innerHTML = `<span class="text-blue-400 font-bold">SWARAJ:</span> <span class="text-gray-200">${text}</span>`;
            } else if (type === "ai") {
                msgDiv.innerHTML = `<span class="text-[#00ffcc] font-bold">JARVIS:</span> <span class="text-white glow-text">${text}</span>`;
            } else if (type === "error") {
                msgDiv.innerHTML = `<span class="text-red-500 font-bold">[ERROR]:</span> <span class="text-red-400">${text}</span>`;
            } else {
                msgDiv.className = "text-gray-500 italic text-xs";
                msgDiv.innerText = `> ${text}`;
            }
            terminalOutput.appendChild(msgDiv);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }
    </script>
</body>
</html>
